# Generated by scripts/gen_readme.py. Renders every README card into the cards-output branch.
name: Generate README cards

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: pin-boykopovar-anyps5 (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=pipe1os&repo=boykopovar/AnyPS5&description_lines_count=3&card_width=304&border_radius=8&show_owner=true&bg_color=0c0c0d&title_color=ecebe6&text_color=8f8e89&icon_color=8f8e89&border_color=2c2c2d
          path: dist/pin-boykopovar-anyps5-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: pin-boykopovar-anyps5 (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=pipe1os&repo=boykopovar/AnyPS5&description_lines_count=3&card_width=304&border_radius=8&show_owner=true&bg_color=ffffff&title_color=0c0c0d&text_color=63625e&icon_color=63625e&border_color=d6d5cf
          path: dist/pin-boykopovar-anyps5-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: pin-withastro-astro (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=pipe1os&repo=withastro/astro&description_lines_count=3&card_width=304&border_radius=8&show_owner=true&bg_color=0c0c0d&title_color=ecebe6&text_color=8f8e89&icon_color=8f8e89&border_color=2c2c2d
          path: dist/pin-withastro-astro-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: pin-withastro-astro (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=pipe1os&repo=withastro/astro&description_lines_count=3&card_width=304&border_radius=8&show_owner=true&bg_color=ffffff&title_color=0c0c0d&text_color=63625e&icon_color=63625e&border_color=d6d5cf
          path: dist/pin-withastro-astro-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: pin-strands-agents-harness-sdk (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=pipe1os&repo=strands-agents/harness-sdk&description_lines_count=3&card_width=304&border_radius=8&show_owner=true&bg_color=0c0c0d&title_color=ecebe6&text_color=8f8e89&icon_color=8f8e89&border_color=2c2c2d
          path: dist/pin-strands-agents-harness-sdk-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: pin-strands-agents-harness-sdk (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=pipe1os&repo=strands-agents/harness-sdk&description_lines_count=3&card_width=304&border_radius=8&show_owner=true&bg_color=ffffff&title_color=0c0c0d&text_color=63625e&icon_color=63625e&border_color=d6d5cf
          path: dist/pin-strands-agents-harness-sdk-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: pin-pipe1os-shipdot (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=pipe1os&repo=pipe1os/shipdot&description_lines_count=3&card_width=304&border_radius=8&bg_color=0c0c0d&title_color=ecebe6&text_color=8f8e89&icon_color=8f8e89&border_color=2c2c2d
          path: dist/pin-pipe1os-shipdot-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: pin-pipe1os-shipdot (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=pipe1os&repo=pipe1os/shipdot&description_lines_count=3&card_width=304&border_radius=8&bg_color=ffffff&title_color=0c0c0d&text_color=63625e&icon_color=63625e&border_color=d6d5cf
          path: dist/pin-pipe1os-shipdot-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: pin-pipe1os-modelinfo-cli (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=pipe1os&repo=pipe1os/modelinfo-cli&description_lines_count=3&card_width=304&border_radius=8&bg_color=0c0c0d&title_color=ecebe6&text_color=8f8e89&icon_color=8f8e89&border_color=2c2c2d
          path: dist/pin-pipe1os-modelinfo-cli-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: pin-pipe1os-modelinfo-cli (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=pipe1os&repo=pipe1os/modelinfo-cli&description_lines_count=3&card_width=304&border_radius=8&bg_color=ffffff&title_color=0c0c0d&text_color=63625e&icon_color=63625e&border_color=d6d5cf
          path: dist/pin-pipe1os-modelinfo-cli-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: pin-ceoubb-ceoubb (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=pipe1os&repo=CEOUBB/CEOUBB&description_lines_count=3&card_width=304&border_radius=8&bg_color=0c0c0d&title_color=ecebe6&text_color=8f8e89&icon_color=8f8e89&border_color=2c2c2d
          path: dist/pin-ceoubb-ceoubb-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: pin-ceoubb-ceoubb (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=pipe1os&repo=CEOUBB/CEOUBB&description_lines_count=3&card_width=304&border_radius=8&bg_color=ffffff&title_color=0c0c0d&text_color=63625e&icon_color=63625e&border_color=d6d5cf
          path: dist/pin-ceoubb-ceoubb-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=pipe1os&disable_animations=true&hide_title=true&show_icons=true&include_all_commits=true&hide=contribs&show=all_time_contribs,prs_merged&card_width=496&border_radius=8&ring_color=ff4f1f&bg_color=0c0c0d&title_color=ecebe6&text_color=8f8e89&icon_color=8f8e89&border_color=2c2c2d
          path: dist/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=pipe1os&disable_animations=true&hide_title=true&show_icons=true&include_all_commits=true&hide=contribs&show=all_time_contribs,prs_merged&card_width=496&border_radius=8&ring_color=ff4f1f&bg_color=ffffff&title_color=0c0c0d&text_color=63625e&icon_color=63625e&border_color=d6d5cf
          path: dist/stats-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: top-langs (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=pipe1os&disable_animations=true&layout=compact&langs_count=8&card_width=338&border_radius=8&bg_color=0c0c0d&title_color=ecebe6&text_color=8f8e89&icon_color=8f8e89&border_color=2c2c2d
          path: dist/top-langs-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: top-langs (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=pipe1os&disable_animations=true&layout=compact&langs_count=8&card_width=338&border_radius=8&bg_color=ffffff&title_color=0c0c0d&text_color=63625e&icon_color=63625e&border_color=d6d5cf
          path: dist/top-langs-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: push cards to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: cards-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
