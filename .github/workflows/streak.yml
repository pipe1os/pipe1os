name: Generate streak card

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: fetch streak.svg
        run: |
          mkdir -p dist
          curl -s "https://streak-stats.demolab.com?user=${{ github.repository_owner }}&locale=en&mode=daily&theme=github_dark&hide_border=false&border_radius=5&order=3" -o dist/streak.svg
          if ! grep -q "<svg" dist/streak.svg; then
            echo "Failed to fetch valid streak SVG"
            exit 1
          fi

      - name: push streak.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: streak-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
